<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Is This? – AI Object Identifier</title>
<meta name="description" content="Upload a photo and AI will identify the object in it.">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e2e0d8;--accent:#c4552d;--accent-ink:#fff;--chip:#efece4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222220;--ink:#f1efe8;--mute:#9b9a92;--line:#363633;--accent:#e2744a;--accent-ink:#1a1a18;--chip:#2c2c29}}
:root[data-theme="dark"]{--bg:#161615;--card:#222220;--ink:#f1efe8;--mute:#9b9a92;--line:#363633;--accent:#e2744a;--accent-ink:#1a1a18;--chip:#2c2c29}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font:600 30px/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;background:var(--card);min-height:220px;cursor:pointer;overflow:hidden;position:relative;text-align:center}
.drop.over{border-color:var(--accent)}
.drop .hint{padding:70px 16px;color:var(--mute)}
.drop .hint b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.drop img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--chip)}
input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.row{display:flex;gap:10px;margin:14px 0}
button{font:inherit;font-weight:600;border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.go{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:6px}
.card h2{font:600 26px/1.2 Georgia,serif;margin:0 0 4px}
.conf{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mute);margin-bottom:10px}
.card p{margin:8px 0}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--chip);border-radius:99px;padding:3px 11px;font-size:14px}
.msg{color:var(--mute);padding:14px 0}
.msg.err{color:#d9534f}
</style>
</head>
<body>
<main>
  <h1>What is this?</h1>
  <p class="sub">Upload or drop a photo and AI will identify the object in it.</p>

  <label class="drop" id="drop">
    <div class="hint" id="hint"><b>Tap to choose a picture</b>or drag &amp; drop one here</div>
    <img id="preview" alt="Selected picture" hidden>
    <input type="file" id="file" accept="image/*">
  </label>

  <div class="row">
    <button class="go" id="go" disabled>Identify object</button>
    <button id="clear" disabled>Clear</button>
  </div>

  <div id="out" aria-live="polite"></div>
</main>

<script>
(function(){
  var fileEl=document.getElementById('file'),drop=document.getElementById('drop'),
      prev=document.getElementById('preview'),hint=document.getElementById('hint'),
      go=document.getElementById('go'),clear=document.getElementById('clear'),out=document.getElementById('out');
  var blob=null,ctl=null;

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function setMsg(t,err){out.innerHTML='<div class="msg'+(err?' err':'')+'">'+esc(t)+'</div>';}

  function setFile(f){
    if(!f||!/^image\//.test(f.type)){setMsg('Please choose an image file.',true);return;}
    blob=f;
    if(prev.dataset.u)URL.revokeObjectURL(prev.dataset.u);
    var u=URL.createObjectURL(f);prev.dataset.u=u;prev.src=u;prev.hidden=false;hint.hidden=true;
    go.disabled=false;clear.disabled=false;out.innerHTML='';
  }
  function reset(){
    if(ctl)ctl.abort();
    blob=null;fileEl.value='';prev.hidden=true;prev.removeAttribute('src');hint.hidden=false;
    go.disabled=true;clear.disabled=true;out.innerHTML='';
  }

  fileEl.addEventListener('change',function(){if(fileEl.files[0])setFile(fileEl.files[0]);});
  clear.addEventListener('click',reset);
  ['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over');});});
  drop.addEventListener('drop',function(ev){var f=ev.dataTransfer&&ev.dataTransfer.files[0];if(f)setFile(f);});

  // Shrink the photo in the browser so uploads stay small and fast.
  function toJpegBase64(file){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var max=1568,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',0.85).split(',')[1]);
      };
      img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('decode'));};
      img.src=url;
    });
  }

  function render(r){
    var alts=(r.alternatives||[]).filter(Boolean);
    out.innerHTML='<div class="card"><h2>'+esc(r.name||'Unknown')+'</h2>'+
      '<span class="conf">'+esc(r.category||'Object')+' · '+esc(r.confidence||'unknown')+' confidence</span>'+
      '<p>'+esc(r.description)+'</p>'+
      (r.details?'<div class="label">Details</div><p>'+esc(r.details)+'</p>':'')+
      (alts.length?'<div class="label">Could also be</div><div class="chips">'+alts.map(function(a){return '<span>'+esc(a)+'</span>';}).join('')+'</div>':'')+
      '</div>';
  }

  go.addEventListener('click',async function(){
    if(!blob)return;
    ctl=new AbortController();
    go.disabled=true;setMsg('Looking closely…');
    try{
      var b64=await toJpegBase64(blob);
      var res=await fetch('/api/identify',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:b64,mediaType:'image/jpeg'}),signal:ctl.signal
      });
      var data=await res.json().catch(function(){return {};});
      if(!res.ok){
        setMsg(res.status===429?'Too many requests. Please try again in a little while.':
               (data.error||'Something went wrong. Please try again.'),true);
        return;
      }
      render(data);
    }catch(e){
      if(e&&e.name==='AbortError')return;
      setMsg(e&&e.message==='decode'?'That image could not be read. Try a different file.':'Something went wrong. Please try again.',true);
    }finally{go.disabled=!blob;}
  });
})();
</script>
</body>
</html>
